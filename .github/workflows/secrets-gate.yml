# PR secrets gate — free replacement for GitHub Secret Protection push
# protection (decision 2026-07-05: paid GitHub security SKUs declined on cost;
# SAST = SonarQube, secrets = gitleaks).
#
# Blocks a merge to main when the PR's commits contain anything token-shaped.
# Make it bite: main ruleset -> Require status checks -> add "gitleaks".
#
# Trade-off vs paid push protection: this fires at merge time, not push time —
# a caught secret already exists in the PR branch, so it is BURNED: rotate it,
# then rewrite/close the branch. Never merge past a red gate.

name: secrets-gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the PR's commits for secrets
        run: |
          set -euo pipefail
          V=8.24.3
          curl -sSL -o gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar -xzf gl.tar.gz gitleaks
          git fetch -q origin "${{ github.base_ref }}"
          ./gitleaks detect --source . \
            --log-opts "origin/${{ github.base_ref }}..HEAD" \
            --report-format json --report-path gitleaks-pr.json -v

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::Secrets detected in this PR's commits. That credential is now"
          echo "::error::in git history and must be treated as BURNED:"
          echo "::error::  1. Rotate the credential NOW (before fixing the PR)."
          echo "::error::  2. Remove it from the code AND rewrite/recreate the branch."
          echo "::error::  3. Note the rotation in #compliance-ops.  [DEV-002]"
